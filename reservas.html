<body data-page="reservas"><main><section><div class="wrap" style="max-width:640px"><h1>Reservar mesa en Cuartango Argentina</h1>
<p class="muted">Elige local, fecha y número de personas, y reserva al instante. Para grupos de más de 10 personas, <a href="catering.html#consulta">escríbenos por el formulario</a>.</p>
<form id="book-form" class="card">
  <label for="b-venue">Local</label><select id="b-venue"><option value="las-palmas">Local Las Palmas</option><option value="vecindario" disabled>Nuevo Local Vecindario (próximamente)</option></select>
  <label for="b-date">Fecha</label><input id="b-date" type="date" required>
  <label for="b-party">Personas</label><select id="b-party"></select>
  <label>Hora</label><div id="b-slots" class="slots" aria-live="polite"></div>
  <div id="b-msg" class="form-msg" role="status"></div>
  <label for="b-name">Nombre</label><input id="b-name" required autocomplete="name">
  <label for="b-phone">Teléfono</label><input id="b-phone" type="tel" required autocomplete="tel">
  <label for="b-email">Email</label><input id="b-email" type="email" required autocomplete="email">
  <label for="b-notes">Notas (alergias, celebración…)</label><textarea id="b-notes" rows="3"></textarea>
  <input name="website" id="b-website" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
  <label class="check"><input type="checkbox" id="b-consent" required> He leído y acepto la <a href="privacidad.html">política de privacidad</a> y que Cuartango use mis datos para gestionar esta reserva.</label>
  <p><button id="b-submit" class="btn" disabled>Confirmar reserva</button></p>
</form><div id="b-result"></div></div></section></main>
<script>for(let i=1;i<=10;i++)document.getElementById('b-party').add(new Option(i+(i>1?' personas':' persona'),i));</script>
